name: Deploy slides to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout deck
        uses: actions/checkout@v4

      # Pinned deliberately. 3e22e35 = main on 2026-11-11: everything up to
      # FNNDSC/slidedown#7 (theme, labels, .bars{}, .term/.takeaway/.source),
      # plus terminal typewriters that type only the command, code styled for a
      # terminal window, Up/Down panning on a slide taller than the page, and
      # Fira Code shipped with the theme and named on pre blocks. The deck
      # needs the last five: without the font on pre the figures lose their
      # alignment on Android. Bump on purpose.
      - name: Checkout slidedown
        uses: actions/checkout@v4
        with:
          repository: FNNDSC/slidedown
          ref: 3e22e35b2ac739b651b8b7f55d94a56fda2b197e
          path: .slidedown

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install slidedown
        run: pip install -e .slidedown

      - name: Build deck
        run: slidedown . talk --inputFile talk.sd --theme command-line

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: talk

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
